name: CasaFlow CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, feat/secure-public-demo-launch]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This repository currently has no npm lockfile, so npm ci/cache cannot run.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
