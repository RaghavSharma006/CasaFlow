name: CasaFlow CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, feat/secure-public-demo-launch]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
